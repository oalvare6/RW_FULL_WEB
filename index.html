<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Riverway Logistics | Flatbed Motor Carrier</title>

    <meta
      name="description"
      content="Texas-based flatbed transportation carrier providing regional and long-haul services. MC: 1473682 | DOT: 3955747"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="/images/logo.png"
      type="image/png"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#0c0c0c',
                charcoal: '#1a1a1a',
                steel: '#2d2d2d',
                // Primary - Navy blue from logo
                navy: '#1e3a5f',
                'navy-light': '#2a4a73',
                'navy-dark': '#152942',
                // Secondary accent - Orange from logo pins (use sparingly)
                orange: '#e08a3e',
                'orange-light': '#f0a050',
                cream: '#faf9f7',
              }
            },
            fontFamily: {
              display: ['Bebas Neue', 'sans-serif'],
              body: ['DM Sans', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Fonts - Bold industrial display + clean body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />

    <style>
      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: 'DM Sans', sans-serif;
        background-color: #faf9f7;
      }

      /* Display headings */
      .font-display {
        font-family: 'Bebas Neue', sans-serif;
        letter-spacing: 0.02em;
      }

      /* Animations */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes slideInLeft {
        from {
          opacity: 0;
          transform: translateX(-40px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .animate-fade-up {
        animation: fadeUp 0.7s ease-out forwards;
      }

      .animate-fade-in {
        animation: fadeIn 0.6s ease-out forwards;
      }

      .animate-slide-left {
        animation: slideInLeft 0.6s ease-out forwards;
      }

      .animate-scale-in {
        animation: scaleIn 0.5s ease-out forwards;
      }

      .animation-delay-100 { animation-delay: 0.1s; opacity: 0; }
      .animation-delay-200 { animation-delay: 0.2s; opacity: 0; }
      .animation-delay-300 { animation-delay: 0.3s; opacity: 0; }
      .animation-delay-400 { animation-delay: 0.4s; opacity: 0; }
      .animation-delay-500 { animation-delay: 0.5s; opacity: 0; }
      .animation-delay-600 { animation-delay: 0.6s; opacity: 0; }

      /* Subtle grain texture overlay */
      .grain-overlay::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.03;
        pointer-events: none;
        mix-blend-mode: overlay;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1a1a;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e3a5f;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #2a4a73;
      }

      /* Button hover glow effect */
      .btn-glow {
        position: relative;
        overflow: hidden;
      }
      .btn-glow::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.15) 50%, transparent 70%);
        transform: translateX(-100%);
        transition: transform 0.6s ease;
      }
      .btn-glow:hover::after {
        transform: translateX(100%);
      }

      /* Diagonal clip for hero */
      .hero-clip {
        clip-path: polygon(0 0, 100% 0, 100% 92%, 0 100%);
      }

      /* Card lift effect */
      .card-lift {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .card-lift:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      }

      /* Accent underline */
      .accent-underline {
        position: relative;
        display: inline-block;
      }
      .accent-underline::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 60px;
        height: 4px;
        background: #1e3a5f;
      }

      /* Hide scrollbar for galleries */
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
