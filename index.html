<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Riverway Logistics | Flatbed Motor Carrier</title>

    <meta
      name="description"
      content="Texas-based flatbed carrier serving Texas, the Southeast, and select Midwest and Mid-Atlantic lanes. MC: 1473682 | DOT: 3955747"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="/images/logo.png"
      type="image/png"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                ink: '#0b1220',
                charcoal: '#111827',
                slate: '#475569',
                steel: '#e2e8f0',
                'steel-dark': '#334155',
                navy: '#0b2748',
                'navy-light': '#123a63',
                'navy-dark': '#071a30',
                orange: '#f28c28',
                'orange-light': '#ffad4f',
                amber: '#f59e0b',
                cream: '#f8fafc',
              }
            },
            fontFamily: {
              display: ['Montserrat', 'sans-serif'],
              body: ['Open Sans', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Fonts - Geometric display + clean body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --authority-bar-height: 2.25rem;
        --riverway-line: rgba(15, 23, 42, 0.08);
        --riverway-line-strong: rgba(11, 39, 72, 0.14);
        --riverway-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        --riverway-shadow-strong: 0 28px 70px rgba(7, 26, 48, 0.18);
      }

      html {
        scroll-behavior: smooth;
        overflow-x: clip;
        max-width: 100%;
      }

      body {
        font-family: 'Open Sans', sans-serif;
        background:
          radial-gradient(circle at top left, rgba(242, 140, 40, 0.08), transparent 30rem),
          linear-gradient(180deg, #ffffff 0%, #f8fafc 42%, #f1f5f9 100%);
        color: #111827;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        overflow-x: clip;
        max-width: 100%;
      }

      #root {
        overflow-x: clip;
        max-width: 100%;
        min-height: 100%;
      }

      img,
      video {
        max-width: 100%;
        height: auto;
      }

      .font-display {
        font-family: 'Montserrat', sans-serif;
        letter-spacing: -0.02em;
      }

      ::selection {
        background: rgba(242, 140, 40, 0.22);
        color: #071a30;
      }

      /* Animations */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes slideInLeft {
        from {
          opacity: 0;
          transform: translateX(-40px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .animate-fade-up {
        animation: fadeUp 0.7s ease-out forwards;
      }

      .animate-fade-in {
        animation: fadeIn 0.6s ease-out forwards;
      }

      .animate-slide-left {
        animation: slideInLeft 0.6s ease-out forwards;
      }

      .animate-scale-in {
        animation: scaleIn 0.5s ease-out forwards;
      }

      .animation-delay-100 { animation-delay: 0.1s; opacity: 0; }
      .animation-delay-200 { animation-delay: 0.2s; opacity: 0; }
      .animation-delay-300 { animation-delay: 0.3s; opacity: 0; }
      .animation-delay-400 { animation-delay: 0.4s; opacity: 0; }
      .animation-delay-500 { animation-delay: 0.5s; opacity: 0; }
      .animation-delay-600 { animation-delay: 0.6s; opacity: 0; }

      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #e2e8f0;
      }
      ::-webkit-scrollbar-thumb {
        background: #0b2748;
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #123a63;
      }

      .btn-glow {
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }
      .btn-glow::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(110deg, transparent 25%, rgba(255,255,255,0.16) 45%, transparent 65%);
        opacity: 0;
        transform: translateX(-100%);
        transition: opacity 0.2s ease, transform 0.7s ease;
      }
      .btn-glow:hover::after {
        opacity: 1;
        transform: translateX(100%);
      }

      .card-lift {
        transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      }
      .card-lift:hover {
        transform: translateY(-3px);
        box-shadow: var(--riverway-shadow);
        border-color: var(--riverway-line-strong);
      }

      .logistics-surface {
        background-image:
          linear-gradient(rgba(11, 39, 72, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(11, 39, 72, 0.035) 1px, transparent 1px);
        background-size: 44px 44px;
      }

      .fine-border {
        border-color: var(--riverway-line);
      }

      .soft-panel-shadow {
        box-shadow: var(--riverway-shadow);
      }

      .strong-panel-shadow {
        box-shadow: var(--riverway-shadow-strong);
      }

      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Scroll reveal */
      .reveal {
        opacity: 0;
        transform: translateY(14px);
        transition: opacity 0.5s ease, transform 0.5s ease;
      }

      .reveal.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .reveal-stagger > .reveal-child {
        opacity: 0;
        transform: translateY(16px);
        transition: opacity 0.5s ease, transform 0.5s ease;
      }

      .reveal-stagger.is-visible > .reveal-child {
        opacity: 1;
        transform: translateY(0);
      }

      .reveal-stagger.is-visible > .reveal-child:nth-child(1) { transition-delay: 0ms; }
      .reveal-stagger.is-visible > .reveal-child:nth-child(2) { transition-delay: 80ms; }
      .reveal-stagger.is-visible > .reveal-child:nth-child(3) { transition-delay: 160ms; }
      .reveal-stagger.is-visible > .reveal-child:nth-child(4) { transition-delay: 240ms; }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .reveal,
        .reveal.is-visible,
        .reveal-stagger > .reveal-child,
        .reveal-stagger.is-visible > .reveal-child {
          opacity: 1;
          transform: none;
          transition: none;
        }

        .animate-fade-up,
        .animate-fade-in,
        .animate-slide-left,
        .animate-scale-in {
          animation: none;
          opacity: 1;
        }

        .animation-delay-100,
        .animation-delay-200,
        .animation-delay-300,
        .animation-delay-400,
        .animation-delay-500,
        .animation-delay-600 {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
