<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Riverway Logistics | Flatbed Motor Carrier</title>

    <meta
      name="description"
      content="Texas-based flatbed transportation carrier providing regional and long-haul services. MC: 1473682 | DOT: 3955747"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="/images/logo.png"
      type="image/png"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                ink: '#0b1220',
                charcoal: '#111827',
                slate: '#475569',
                steel: '#e2e8f0',
                'steel-dark': '#334155',
                navy: '#0b2748',
                'navy-light': '#123a63',
                'navy-dark': '#071a30',
                orange: '#f28c28',
                'orange-light': '#ffad4f',
                amber: '#f59e0b',
                cream: '#f8fafc',
              }
            },
            fontFamily: {
              display: ['Montserrat', 'sans-serif'],
              body: ['Open Sans', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Fonts - Geometric display + clean body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: 'Open Sans', sans-serif;
        background-color: #f8fafc;
        color: #111827;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      .font-display {
        font-family: 'Montserrat', sans-serif;
        letter-spacing: 0;
      }

      /* Animations */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes slideInLeft {
        from {
          opacity: 0;
          transform: translateX(-40px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .animate-fade-up {
        animation: fadeUp 0.7s ease-out forwards;
      }

      .animate-fade-in {
        animation: fadeIn 0.6s ease-out forwards;
      }

      .animate-slide-left {
        animation: slideInLeft 0.6s ease-out forwards;
      }

      .animate-scale-in {
        animation: scaleIn 0.5s ease-out forwards;
      }

      .animation-delay-100 { animation-delay: 0.1s; opacity: 0; }
      .animation-delay-200 { animation-delay: 0.2s; opacity: 0; }
      .animation-delay-300 { animation-delay: 0.3s; opacity: 0; }
      .animation-delay-400 { animation-delay: 0.4s; opacity: 0; }
      .animation-delay-500 { animation-delay: 0.5s; opacity: 0; }
      .animation-delay-600 { animation-delay: 0.6s; opacity: 0; }

      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #e2e8f0;
      }
      ::-webkit-scrollbar-thumb {
        background: #0b2748;
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #123a63;
      }

      .btn-glow {
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }
      .btn-glow::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.15) 50%, transparent 70%);
        transform: translateX(-100%);
        transition: transform 0.6s ease;
      }
      .btn-glow:hover::after {
        transform: translateX(100%);
      }

      .card-lift {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .card-lift:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 35px rgba(15, 23, 42, 0.12);
      }

      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
